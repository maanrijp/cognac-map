<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cognac crus — preview</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 1; top: 10px; left: 10px;
    background: rgba(255,255,255,0.92); padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25); font-size: 13px;
  }
  .panel b { display:block; margin-bottom: 4px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .legend div { margin: 2px 0; }
  button { cursor: pointer; margin-top: 6px; }
</style>
</head>
<body>
<div class="panel">
  <b>Cognac crus — preview</b>
  <div class="legend">
    <div><i style="background:rgb(230,73,41)"></i>Grande Champagne</div>
    <div><i style="background:rgb(237,120,55)"></i>Petite Champagne</div>
    <div><i style="background:rgb(249,171,22)"></i>Borderies</div>
    <div><i style="background:rgb(253,222,64)"></i>Fins Bois</div>
    <div><i style="background:rgb(167,208,99)"></i>Bons Bois</div>
    <div><i style="background:rgb(115,175,76)"></i>Bois Ordinaires</div>
  </div>
  <button id="toggle">Wissel light / dark</button>
</div>
<div id="map"></div>
<script>
  // Pas deze paden eventueel aan (lokale bestanden of gehoste URL's).
  const STYLES = {
    light: "./cognac-crus-style-light.json",
    dark:  "./cognac-crus-style-dark.json",
  };
  let current = "light";

  const map = new maplibregl.Map({
    container: "map",
    style: STYLES[current],
    center: [-0.33, 45.62],   // omgeving Cognac/Segonzac
    zoom: 8,
  });
  map.addControl(new maplibregl.NavigationControl());

  document.getElementById("toggle").addEventListener("click", () => {
    current = current === "light" ? "dark" : "light";
    map.setStyle(STYLES[current]);
  });

  map.on("error", (e) => {
    // Handig bij verkeerde paden of CORS-problemen.
    console.error("MapLibre fout:", e && e.error ? e.error : e);
  });
</script>
</body>
</html>
